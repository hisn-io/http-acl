[package]
name = "http-acl-wasmtime"
description = "An ACL for wasmtime-wasi-http's outgoing requests, through its overridable send_request."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

# One release line per wasmtime major: this one is for wasmtime-wasi-http 36.
[dependencies]
http-acl = { path = "../http-acl", version = "0.14.0" }

bytes = { workspace = true }
http = { workspace = true }
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
rustls = "0.23.46"
tokio = { workspace = true, features = ["net", "time"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
wasmtime-wasi = { version = "36.0.19", default-features = false }
wasmtime-wasi-http = { version = "50.0.0", default-features = false }
webpki-roots = "0.26.11"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
wasmtime = { version = "36.0.19", default-features = false, features = ["component-model"] }
